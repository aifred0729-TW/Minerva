name: Desktop build

# Builds the Minerva Electron desktop app installers for macOS, Windows, and
# Linux. Two ways to trigger:
#   • Push a tag like `v2.1.3`  → builds + publishes a GitHub Release with the
#     installers (and electron-updater metadata).
#   • Run manually (workflow_dispatch) → builds all three and uploads the
#     installers as workflow artifacts, without publishing a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React bundle
        run: npm run electron:build-ui

      # electron-builder auto-detects the target OS from the runner:
      #   macOS → dmg + zip · Windows → nsis · Linux → AppImage + deb
      # On a tag it publishes a GitHub Release; otherwise it only packages.
      - name: Package (and publish on tag)
        run: >-
          npx electron-builder
          --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certs configured yet — build unsigned rather than trying
          # to sign with a random keychain identity in CI. Add signing secrets
          # (CSC_LINK/CSC_KEY_PASSWORD, win certs, notarization) here later.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minerva-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/latest*.yml
