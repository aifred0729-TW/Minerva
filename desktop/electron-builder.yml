# ═══════════════════════════════════════════════════════════════════════════
#  electron-builder — Windows and macOS targets.
#
#  The React bundle is NOT built here. `npm run build` at the repository root
#  produces ../build, and extraResources copies it in whole; the app serves it
#  from its loopback gateway exactly as nginx serves it in the container. One
#  bundle, two deployments, no divergence.
# ═══════════════════════════════════════════════════════════════════════════

appId: tw.redmeow.minerva
productName: Minerva
copyright: Copyright © Minerva — AGPL-3.0 or commercial

directories:
  buildResources: build
  output: dist

# Only the Electron layer is packed into the asar; the web bundle rides along
# as a resource so the gateway can stat and stream real files off disk.
files:
  - src/**/*
  - package.json

# Staged into the project by scripts/prepare-bundle.js. Neither the source
# nor the destination may be clever here: `../build` escapes the project
# directory and `app` collides with app.asar. v2.2.0 shipped with both and
# every window rendered "bundle not found".
extraResources:
  - from: webroot
    to: webroot
    filter:
      - "**/*"

asar: true
npmRebuild: false

# Where `--publish` sends artifacts. Without this electron-builder infers the
# repository from whatever git remote happens to be configured on the runner —
# fine until the day it guesses a fork and publishes there.
publish:
  provider: github
  owner: aifred0729-TW
  repo: Minerva

# Ad-hoc signs the .app when no real identity is configured. Apple Silicon
# refuses to execute a binary carrying no signature at all, so an unsigned
# build is not merely warned about — it does not start. See the script.
afterPack: scripts/adhoc-sign.js

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.developer-tools
  icon: build/icon.mac.png
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Per-arch, not universal. A universal build merges the two per-arch apps
  # with @electron/universal, which requires every non-binary file to hash
  # identically across them — and an ad-hoc signature does not, because each
  # arch gets its own _CodeSignature. Signing after the merge instead would
  # mean trusting that afterPack fires on the universal pass; if it did not,
  # the result is an unsigned app that fails to launch on Apple Silicon with
  # nothing to explain it. Two clearly-named downloads is the cheaper trade.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    # No camera, mic, or location. Declared so the absence is deliberate.
    NSHighResolutionCapable: true

dmg:
  title: Minerva ${version}
  artifactName: Minerva-${version}-macOS-${arch}.${ext}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ── Windows ────────────────────────────────────────────────────────────────
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Minerva
  artifactName: Minerva-${version}-Windows-${arch}-setup.${ext}
  # An operator's settings hold an MSF credential; uninstalling should not
  # silently leave it behind, but neither should an upgrade wipe the target.
  deleteAppDataOnUninstall: false

portable:
  artifactName: Minerva-${version}-Windows-${arch}-portable.${ext}
